#cloud-config
# First boot of the Floor Sense server (Ubuntu 24.04): Caddy for HTTPS, Python venvs,
# a firewall with only SSH and web open, key-only SSH, and a service user. provision.sh
# passes this file as Vultr user data; deploy.sh does everything else.
package_update: true
packages:
  - python3-venv
  - caddy
  - ufw
users:
  - default
  - name: floorsense
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/ssh/sshd_config.d/00-floor-sense.conf
    content: |
      PasswordAuthentication no
runcmd:
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - install -d -m 750 -o root -g floorsense /etc/floor-sense
  - install -d -o floorsense -g floorsense /opt/floor-sense
  - systemctl reload ssh
